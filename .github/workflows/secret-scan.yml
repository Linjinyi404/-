name: Check for committed secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node tools/check-secrets.mjs --tracked
      - run: node tools/check-secrets.mjs --history
